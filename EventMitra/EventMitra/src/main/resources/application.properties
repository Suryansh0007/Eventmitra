spring.application.name=EventMitra
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/eventmitra?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jackson.serialization.fail-on-empty-beans=false

app.jwt.secret=change-this-to-a-very-long-256-bit-secret-for-production
app.jwt.expiration-ms=86400000

razorpay.key-id=rzp_test_key
razorpay.key-secret=rzp_test_secret
razorpay.currency=INR
